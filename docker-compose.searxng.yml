# SearXNG pour le chatbot — service séparé de Next.js
# Documentation : https://docs.searxng.org/admin/installation-docker.html
#
# Démarrage :
#   docker compose -f docker-compose.searxng.yml up -d
# Vérification :
#   curl "http://localhost:8080/search?q=test&format=json"
#
# Architecture :
#   Chatbot → web_search() → SearXNG → moteurs configurés dans SearXNG

name: chatbot-searxng

services:
  searxng:
    container_name: chatbot-searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./docker/searxng/core-config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/

  valkey:
    container_name: chatbot-searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped

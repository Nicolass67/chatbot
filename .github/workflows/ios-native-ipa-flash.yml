name: iOS Native IPA Flash

# Ultra-fast unsigned IPA — build only, no Simulator / UI tests / unit tests.
# Injecte CHATBOT_PUBLIC_BASE_URL (input ou vars) pour éviter your-worker.example.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Origin publique (https://….workers.dev). Vide = vars.CHATBOT_PUBLIC_BASE_URL"
        required: false
        type: string
        default: ""

concurrency:
  group: ios-native-ipa-flash-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  flash-ipa:
    name: Flash IPA (no tests)
    runs-on: macos-26
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require public base URL
        run: |
          set -euo pipefail
          URL="${{ inputs.base_url }}"
          if [ -z "$URL" ]; then
            URL="${{ vars.CHATBOT_PUBLIC_BASE_URL }}"
          fi
          if [ -z "$URL" ]; then
            echo "::error::CHATBOT_PUBLIC_BASE_URL manquante (workflow input base_url ou repo variable)."
            exit 1
          fi
          case "$URL" in
            https://*) ;;
            *) echo "::error::base_url doit commencer par https:// (got: $URL)"; exit 1 ;;
          esac
          if echo "$URL" | grep -qi 'your-worker.example'; then
            echo "::error::Refuse le placeholder your-worker.example.workers.dev"
            exit 1
          fi
          HOST=$(echo "$URL" | sed -E 's#https://([^/]+).*#\1#')
          echo "FLASH_HOST=$HOST" >> "$GITHUB_ENV"
          echo "FLASH_URL=$URL" >> "$GITHUB_ENV"
          echo "Base URL host: \`$HOST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode 26.6 (pinned)
        run: |
          set -euo pipefail
          PIN="/Applications/Xcode_26.6.app"
          if [ ! -d "$PIN" ]; then
            echo "::error::Pinned Xcode 26.6 not found at $PIN"
            ls /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$PIN/Contents/Developer"
          xcodebuild -version | tee /tmp/xcode-version.txt
          grep -E 'Xcode 26\.6' /tmp/xcode-version.txt >/dev/null

      - name: Cache Homebrew XcodeGen
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/bin/xcodegen
          key: brew-xcodegen-flash-v1-${{ runner.os }}
          restore-keys: |
            brew-xcodegen-flash-v1-${{ runner.os }}
            brew-xcodegen-${{ runner.os }}-

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Cache DerivedData (Release device)
        uses: actions/cache@v4
        with:
          path: apps/ios/derived-flash
          key: ios-flash-dd-v1-${{ runner.os }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/ChatbotNative/**/*.swift', 'apps/ios/Public.xcconfig') }}
          restore-keys: |
            ios-flash-dd-v1-${{ runner.os }}-

      - name: Generate Flash xcconfig
        working-directory: apps/ios
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA:0:7}"
          BASE_BUILD=$(grep -E 'CURRENT_PROJECT_VERSION:' project.yml | head -1 | sed -E 's/.*: *"([^"]+)".*/\1/')
          FLASH_BUILD="${BASE_BUILD}.${GITHUB_RUN_NUMBER}"
          XC_URL=$(echo "$FLASH_URL" | sed -E 's#https://#https:/$()/#')
          cat > Flash.xcconfig <<EOF
          // Generated by ios-native-ipa-flash.yml — do not commit
          CURRENT_PROJECT_VERSION = ${FLASH_BUILD}
          QA_GIT_SHA = ${SHA_SHORT}
          CHATBOT_PUBLIC_BASE_URL = ${XC_URL}
          GCC_PREPROCESSOR_DEFINITIONS = \$(inherited) QA_BUILD=1
          SWIFT_ACTIVE_COMPILATION_CONDITIONS = \$(inherited) QA_BUILD
          EOF
          echo "FLASH_BUILD=${FLASH_BUILD}" >> "$GITHUB_ENV"
          echo "QA_GIT_SHA_SHORT=${SHA_SHORT}" >> "$GITHUB_ENV"
          echo "Flash build=\`${FLASH_BUILD}\` sha=\`${SHA_SHORT}\` host=\`${FLASH_HOST}\`" >> "$GITHUB_STEP_SUMMARY"
          cat Flash.xcconfig

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build Release unsigned (Flash)
        working-directory: apps/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project ChatbotNative.xcodeproj \
            -scheme ChatbotNative \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived-flash \
            -xcconfig Flash.xcconfig \
            CURRENT_PROJECT_VERSION="${FLASH_BUILD}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_SWIFT_FLAGS='$(inherited) -DQA_BUILD' \
            build

      - name: Package IPA + meta
        working-directory: apps/ios
        run: |
          set -euo pipefail
          APP_PATH="derived-flash/Build/Products/Release-iphoneos/ChatbotNative.app"
          test -d "$APP_PATH"
          if grep -RIl "OAUTH_TOKEN_ENCRYPTION_KEY\|GOOGLE_OAUTH_CLIENT_SECRET\|CLOUDFLARE_TUNNEL_TOKEN\|HEALTH_CHECK_TOKEN\|chs_" "$APP_PATH" 2>/dev/null; then
            echo "Refusing IPA: secret-looking strings found in app bundle" >&2
            exit 1
          fi
          # Force-inject origin into the built Info.plist (XcodeGen / expand can drop the key).
          /usr/libexec/PlistBuddy -c "Add :ChatbotPublicBaseURL string ${FLASH_URL}" "$APP_PATH/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ChatbotPublicBaseURL ${FLASH_URL}" "$APP_PATH/Info.plist"
          PLIST_URL=$(/usr/libexec/PlistBuddy -c 'Print :ChatbotPublicBaseURL' "$APP_PATH/Info.plist" 2>/dev/null || true)
          echo "Info.plist ChatbotPublicBaseURL=${PLIST_URL}"
          if [ -z "$PLIST_URL" ]; then
            echo "::error::ChatbotPublicBaseURL missing from Info.plist after inject"
            exit 1
          fi
          if echo "$PLIST_URL" | grep -qi 'your-worker.example'; then
            echo "::error::IPA still contains placeholder base URL"
            exit 1
          fi
          case "$PLIST_URL" in
            *"${FLASH_HOST}"*) ;;
            *)
              echo "::error::Info.plist host mismatch (want ${FLASH_HOST}, got ${PLIST_URL})"
              exit 1
              ;;
          esac
          /usr/libexec/PlistBuddy -c "Add :QAGitSHA string ${QA_GIT_SHA_SHORT}" "$APP_PATH/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :QAGitSHA ${QA_GIT_SHA_SHORT}" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${FLASH_BUILD}" "$APP_PATH/Info.plist" || true
          rm -rf Payload ChatbotNative-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          # Re-verify packaged Payload (not just pre-copy APP_PATH)
          PAYLOAD_URL=$(/usr/libexec/PlistBuddy -c 'Print :ChatbotPublicBaseURL' "Payload/ChatbotNative.app/Info.plist")
          echo "Payload ChatbotPublicBaseURL=${PAYLOAD_URL}"
          if [ -z "$PAYLOAD_URL" ] || echo "$PAYLOAD_URL" | grep -qi 'your-worker.example'; then
            echo "::error::Packaged IPA Info.plist still missing/placeholder base URL"
            exit 1
          fi
          zip -qr ChatbotNative-unsigned.ipa Payload
          ls -lh ChatbotNative-unsigned.ipa
          MARKETING=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" 2>/dev/null || echo "3.0.0")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          cat > qa-meta.json <<EOF
          {
            "git_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "build": "${FLASH_BUILD}",
            "marketing": "${MARKETING}",
            "bundle_id": "${BUNDLE_ID}",
            "workflow": "ipa-flash",
            "base_url_host": "${FLASH_HOST}",
            "base_url": "${FLASH_URL}"
          }
          EOF
          cat qa-meta.json
          cat qa-meta.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Flash IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatbot-ios-native-qa-unsigned
          path: |
            apps/ios/ChatbotNative-unsigned.ipa
            apps/ios/qa-meta.json
          if-no-files-found: error
          retention-days: 5

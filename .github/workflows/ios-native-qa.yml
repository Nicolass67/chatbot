name: iOS Native Fast QA

# Fast path: IPA unsigned only (no unit/UI tests).
# Triggered by ios:fast-build / ios:deploy — NOT on every push (avoids double build with Full CI).

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Origin publique https://….workers.dev (vide = vars.CHATBOT_PUBLIC_BASE_URL)"
        required: false
        type: string
        default: ""
  workflow_call:

concurrency:
  group: ios-native-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-qa-ipa:
    name: Fast QA unsigned IPA
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 (pinned)
        run: |
          set -euo pipefail
          PIN="/Applications/Xcode_26.6.app"
          if [ ! -d "$PIN" ]; then
            echo "::error::Pinned Xcode 26.6 not found at $PIN"
            ls /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$PIN/Contents/Developer"
          xcodebuild -version
          xcodebuild -version | grep -E 'Xcode 26\.6' || {
            echo "::error::Expected Xcode 26.6 after pin"
            exit 1
          }

      - name: Cache Homebrew XcodeGen
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/bin/xcodegen
          key: brew-xcodegen-${{ runner.os }}-${{ hashFiles('.github/workflows/ios-native-qa.yml') }}
          restore-keys: |
            brew-xcodegen-${{ runner.os }}-

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Generate QA xcconfig + bump build
        working-directory: apps/ios
        env:
          INPUT_BASE_URL: ${{ github.event.inputs.base_url || '' }}
          VAR_BASE_URL: ${{ vars.CHATBOT_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA:0:7}"
          BASE_BUILD=$(grep -E 'CURRENT_PROJECT_VERSION:' project.yml | head -1 | sed -E 's/.*: *"([^"]+)".*/\1/')
          QA_BUILD="${BASE_BUILD}.${GITHUB_RUN_NUMBER}"
          URL="${INPUT_BASE_URL:-}"
          if [ -z "$URL" ]; then URL="${VAR_BASE_URL:-}"; fi
          if [ -z "$URL" ]; then
            echo "::error::CHATBOT_PUBLIC_BASE_URL manquante (input base_url ou vars.CHATBOT_PUBLIC_BASE_URL)"
            exit 1
          fi
          case "$URL" in https://*) ;; *) echo "::error::base_url must be https://"; exit 1 ;; esac
          if echo "$URL" | grep -qi 'your-worker.example'; then
            echo "::error::Refuse placeholder base URL"; exit 1
          fi
          QA_HOST=$(echo "$URL" | sed -E 's#https://([^/]+).*#\1#')
          XC_URL=$(echo "$URL" | sed -E 's#https://#https:/$()/#')
          EXTRA_URL_LINE="CHATBOT_PUBLIC_BASE_URL = ${XC_URL}"
          echo "QA base host: ${QA_HOST}" >> "$GITHUB_STEP_SUMMARY"
          cat > QA.xcconfig <<EOF
          // Generated by ios-native-qa.yml — do not commit
          CURRENT_PROJECT_VERSION = ${QA_BUILD}
          QA_GIT_SHA = ${SHA_SHORT}
          ${EXTRA_URL_LINE}
          GCC_PREPROCESSOR_DEFINITIONS = \$(inherited) QA_BUILD=1
          SWIFT_ACTIVE_COMPILATION_CONDITIONS = \$(inherited) QA_BUILD
          EOF
          echo "QA_BUILD=${QA_BUILD}" >> "$GITHUB_ENV"
          echo "QA_GIT_SHA_SHORT=${SHA_SHORT}" >> "$GITHUB_ENV"
          echo "QA_BASE_URL=${URL}" >> "$GITHUB_ENV"
          echo "QA_HOST=${QA_HOST}" >> "$GITHUB_ENV"
          echo "QA build=${QA_BUILD} sha=${SHA_SHORT}" >> "$GITHUB_STEP_SUMMARY"
          cat QA.xcconfig

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build Release unsigned (Fast QA)
        working-directory: apps/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project ChatbotNative.xcodeproj \
            -scheme ChatbotNative \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived \
            -xcconfig QA.xcconfig \
            CURRENT_PROJECT_VERSION="${QA_BUILD}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_SWIFT_FLAGS='$(inherited) -DQA_BUILD' \
            build

      - name: Package IPA + qa-meta.json
        working-directory: apps/ios
        run: |
          set -euo pipefail
          APP_PATH="derived/Build/Products/Release-iphoneos/ChatbotNative.app"
          test -d "$APP_PATH"
          if grep -RIl "OAUTH_TOKEN_ENCRYPTION_KEY\|GOOGLE_OAUTH_CLIENT_SECRET\|CLOUDFLARE_TUNNEL_TOKEN\|HEALTH_CHECK_TOKEN\|chs_" "$APP_PATH" 2>/dev/null; then
            echo "Refusing IPA: secret-looking strings found in app bundle" >&2
            exit 1
          fi
          # Force-inject origin (XcodeGen can omit ChatbotPublicBaseURL from Info.plist).
          /usr/libexec/PlistBuddy -c "Add :ChatbotPublicBaseURL string ${QA_BASE_URL}" "$APP_PATH/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ChatbotPublicBaseURL ${QA_BASE_URL}" "$APP_PATH/Info.plist"
          PLIST_URL=$(/usr/libexec/PlistBuddy -c 'Print :ChatbotPublicBaseURL' "$APP_PATH/Info.plist" 2>/dev/null || true)
          echo "Info.plist ChatbotPublicBaseURL=${PLIST_URL}"
          if [ -z "$PLIST_URL" ] || echo "$PLIST_URL" | grep -qi 'your-worker.example'; then
            echo "::error::ChatbotPublicBaseURL missing or placeholder in Info.plist"
            exit 1
          fi
          case "$PLIST_URL" in
            *"${QA_HOST}"*) ;;
            *)
              echo "::error::Info.plist host mismatch (want ${QA_HOST}, got ${PLIST_URL})"
              exit 1
              ;;
          esac
          # Inject QA git sha into Info.plist for Settings banner
          /usr/libexec/PlistBuddy -c "Add :QAGitSHA string ${QA_GIT_SHA_SHORT}" "$APP_PATH/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :QAGitSHA ${QA_GIT_SHA_SHORT}" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${QA_BUILD}" "$APP_PATH/Info.plist" || true
          rm -rf Payload ChatbotNative-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qr ChatbotNative-unsigned.ipa Payload
          ls -lh ChatbotNative-unsigned.ipa
          MARKETING=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" 2>/dev/null || echo "3.0.0")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          cat > qa-meta.json <<EOF
          {
            "git_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "build": "${QA_BUILD}",
            "marketing": "${MARKETING}",
            "bundle_id": "${BUNDLE_ID}",
            "workflow": "qa",
            "base_url_host": "${QA_HOST}"
          }
          EOF
          cat qa-meta.json >> "$GITHUB_STEP_SUMMARY"
          echo "Fast QA unsigned IPA ready." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Fast QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatbot-ios-native-qa-unsigned
          path: |
            apps/ios/ChatbotNative-unsigned.ipa
            apps/ios/qa-meta.json
          if-no-files-found: error
          retention-days: 7

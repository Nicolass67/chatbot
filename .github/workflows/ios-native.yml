name: iOS Native Full CI

# Gate push/PR — budget dur ≤5 min.
# Pas d’IPA ici (→ ios-native-ipa-flash / ios-native-qa).
# Pas de suite UI complète (→ ios-native-simulator plan=smoke|all).
# CI pin: macos-26 + Xcode 26.6.

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-native.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-native.yml"

concurrency:
  group: ios-native-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  gate:
    name: Full CI — unit gate (≤5m)
    runs-on: macos-26
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 (pinned)
        run: |
          set -euo pipefail
          PIN="/Applications/Xcode_26.6.app"
          if [ ! -d "$PIN" ]; then
            echo "::error::Pinned Xcode 26.6 not found at $PIN"
            ls /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$PIN/Contents/Developer"
          xcodebuild -version | tee /tmp/xcode-version.txt
          grep -E 'Xcode 26\.6' /tmp/xcode-version.txt >/dev/null

      - name: Cache Homebrew XcodeGen
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/bin/xcodegen
          key: brew-xcodegen-full-v2-${{ runner.os }}
          restore-keys: |
            brew-xcodegen-full-v2-${{ runner.os }}-
            brew-xcodegen-${{ runner.os }}-

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Cache DerivedData (unit)
        uses: actions/cache@v4
        with:
          path: apps/ios/derived-unit
          key: ios-unit-dd-v1-${{ runner.os }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/ChatbotNative/**/*.swift', 'apps/ios/ChatbotNativeTests/**/*.swift') }}
          restore-keys: |
            ios-unit-dd-v1-${{ runner.os }}-

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Resolve + boot Simulator (fast)
        id: sim
        run: |
          set -euo pipefail
          GATE_START=$(date +%s)
          echo "GATE_START=$GATE_START" >> "$GITHUB_ENV"
          PREFER="${IOS_SIMULATOR_DEVICE:-iPhone 17}"
          xcrun simctl list devices available > /tmp/devices.txt
          UDID=$(python3 - <<'PY'
          import re
          prefer = "iphone 17"
          text = open("/tmp/devices.txt", encoding="utf-8", errors="replace").read()
          fallback = None
          for line in text.splitlines():
              if "iPhone" not in line or "unavailable" in line.lower():
                  continue
              m = re.search(r"\(([A-F0-9-]{36})\)", line)
              if not m:
                  continue
              udid = m.group(1)
              if prefer in line.lower():
                  print(udid)
                  raise SystemExit(0)
              if fallback is None:
                  fallback = udid
          if fallback:
              print(fallback)
          else:
              raise SystemExit(1)
          PY
          )
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          # bootstatus court — pas de wait infini
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true

      - name: Unit tests (only)
        working-directory: apps/ios
        run: |
          set -euo pipefail
          TEST_START=$(date +%s)
          xcodebuild test \
            -project ChatbotNative.xcodeproj \
            -scheme ChatbotNativeUnit \
            -destination "id=${UDID}" \
            -derivedDataPath derived-unit \
            -parallel-testing-enabled YES \
            -maximum-parallel-testers 2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_TESTABILITY=YES \
            -only-testing:ChatbotNativeTests \
            -quiet
          TEST_END=$(date +%s)
          ELAPSED=$((TEST_END - GATE_START))
          TEST_S=$((TEST_END - TEST_START))
          {
            echo "## Full CI gate (≤5m budget)"
            echo "- unit tests: ${TEST_S}s"
            echo "- wall since job start marker: ${ELAPSED}s"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ELAPSED" -gt 300 ]; then
            echo "::warning::Gate exceeded 5 min wall (${ELAPSED}s) — investigate cache / sim boot"
          fi

      - name: Budget check
        if: always()
        run: |
          set -euo pipefail
          NOW=$(date +%s)
          ELAPSED=$((NOW - ${GATE_START:-NOW}))
          echo "Total gate wall ≈ ${ELAPSED}s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ELAPSED" -gt 360 ]; then
            echo "::error::Hard fail: Full CI gate >6 min (${ELAPSED}s). Slim further."
            exit 1
          fi

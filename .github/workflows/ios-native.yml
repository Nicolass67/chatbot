name: iOS Native Full CI

# Gate push/PR — budget dur ≤5 min.
# Compile-only (generic iOS Simulator) — pas de boot Simulator, pas d’UI, pas d’IPA.
# UI gate : ios-native-simulator.yml plan=smoke
# IPA : ios-native-ipa-flash / ios-native-qa
# CI pin: macos-26 + Xcode 26.6

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-native.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-native.yml"

concurrency:
  group: ios-native-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  gate:
    name: Full CI — compile gate (≤5m)
    runs-on: macos-26
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 (pinned)
        run: |
          set -euo pipefail
          PIN="/Applications/Xcode_26.6.app"
          if [ ! -d "$PIN" ]; then
            echo "::error::Pinned Xcode 26.6 not found at $PIN"
            ls /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$PIN/Contents/Developer"
          xcodebuild -version | tee /tmp/xcode-version.txt
          grep -E 'Xcode 26\.6' /tmp/xcode-version.txt >/dev/null
          echo "GATE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Cache Homebrew XcodeGen
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/bin/xcodegen
          key: brew-xcodegen-full-v3-${{ runner.os }}
          restore-keys: |
            brew-xcodegen-full-v3-${{ runner.os }}-
            brew-xcodegen-${{ runner.os }}-

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Cache DerivedData (compile)
        uses: actions/cache@v4
        with:
          path: apps/ios/derived-unit
          key: ios-compile-dd-v1-${{ runner.os }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/ChatbotNative/**/*.swift', 'apps/ios/ChatbotNativeTests/**/*.swift') }}
          restore-keys: |
            ios-compile-dd-v1-${{ runner.os }}-

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Compile (generic iOS Simulator)
        working-directory: apps/ios
        run: |
          set -euo pipefail
          BUILD_START=$(date +%s)
          # generic = pas de boot Simulator → wall time stable
          xcodebuild build \
            -project ChatbotNative.xcodeproj \
            -scheme ChatbotNative \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath derived-unit \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_TESTABILITY=YES \
            -quiet
          BUILD_END=$(date +%s)
          BUILD_S=$((BUILD_END - BUILD_START))
          ELAPSED=$((BUILD_END - GATE_START))
          {
            echo "## Full CI compile gate (≤5m)"
            echo "- xcodebuild build: ${BUILD_S}s"
            echo "- wall: ${ELAPSED}s"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ELAPSED" -gt 300 ]; then
            echo "::warning::Gate wall ${ELAPSED}s > 5m (cache miss?)"
          fi
          if [ "$ELAPSED" -gt 360 ]; then
            echo "::error::Hard fail: compile gate >6 min (${ELAPSED}s)"
            exit 1
          fi

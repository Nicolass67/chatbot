name: iOS Native Fast Simulator

# Fast Simulator QA — UI tests + PNG (no IPA).
# Orchestrated by: npm.cmd run ios:sim
# TEST_PLAN: all | mail | chat | files | gate | assistants

on:
  workflow_dispatch:
    inputs:
      test_plan:
        description: "Suite (smoke≤5m | gate | chat | mail | files | assistants | all=long)"
        required: false
        default: "smoke"
        type: choice
        options:
          - smoke
          - gate
          - mail
          - chat
          - files
          - assistants
          - all
  workflow_call:
    inputs:
      test_plan:
        description: "Suite (smoke≤5m | gate | … | all)"
        required: false
        default: "smoke"
        type: string

concurrency:
  group: ios-native-simulator-${{ github.ref }}-${{ inputs.test_plan || 'smoke' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  IOS_SIMULATOR_DEVICE: ${{ vars.IOS_SIMULATOR_DEVICE }}
  IOS_SIMULATOR_OS: ${{ vars.IOS_SIMULATOR_OS }}
  TEST_PLAN: ${{ inputs.test_plan || 'smoke' }}

jobs:
  simulator-ui:
    name: Fast Simulator (${{ inputs.test_plan || 'smoke' }})
    runs-on: macos-26
    # smoke/gate ≤10m soft ; all long opt-in
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 (pinned)
        run: |
          set -euo pipefail
          PIN="/Applications/Xcode_26.6.app"
          if [ ! -d "$PIN" ]; then
            echo "::error::Pinned Xcode 26.6 not found at $PIN"
            ls /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$PIN/Contents/Developer"
          xcodebuild -version | tee /tmp/xcode-version.txt
          grep -E 'Xcode 26\.6' /tmp/xcode-version.txt >/dev/null || {
            echo "::error::Expected Xcode 26.6 after pin"
            exit 1
          }
          echo "XCODE_VERSION=$(head -1 /tmp/xcode-version.txt)" >> "$GITHUB_ENV"

      - name: Cache Homebrew XcodeGen
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/bin/xcodegen
          key: brew-xcodegen-sim-v2-${{ runner.os }}
          restore-keys: |
            brew-xcodegen-sim-v2-${{ runner.os }}
            brew-xcodegen-sim-${{ runner.os }}-

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      # Cache app sources séparément des UITests → hit plus fréquent quand seuls les tests changent.
      - name: Cache DerivedData (app)
        uses: actions/cache@v4
        with:
          path: apps/ios/derived-sim
          key: ios-sim-dd-v2-${{ runner.os }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/ChatbotNative/**/*.swift') }}
          restore-keys: |
            ios-sim-dd-v2-${{ runner.os }}-

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Resolve Simulator destination
        id: sim
        run: |
          set -euo pipefail
          PREFER_NAME="${IOS_SIMULATOR_DEVICE:-iPhone 17}"
          PREFER_OS="${IOS_SIMULATOR_OS:-}"
          export PREFER_NAME PREFER_OS
          # Liste courte — pas de dump complet dans le summary.
          xcrun simctl list devices available > /tmp/devices.txt

          SELECTED=$(python3 <<'PY'
          import os, re
          prefer = (os.environ.get("PREFER_NAME") or "iPhone 17").lower()
          osprefer = (os.environ.get("PREFER_OS") or "").strip()
          text = open("/tmp/devices.txt", encoding="utf-8", errors="replace").read()
          current_os = None
          fallback = None
          for line in text.splitlines():
              m = re.match(r"--\s+iOS\s+([0-9.]+)\s+--", line)
              if m:
                  current_os = m.group(1)
                  continue
              if "iPhone" not in line or "unavailable" in line.lower():
                  continue
              um = re.search(r"\(([A-F0-9-]{36})\)", line)
              if not um:
                  continue
              udid = um.group(1)
              name = re.sub(r"\s*\([A-F0-9-]{36}\).*", "", line).strip()
              if osprefer and current_os and not current_os.startswith(osprefer):
                  continue
              row = f"{udid}|{current_os or '?'}|{name}"
              if prefer and prefer not in name.lower():
                  if fallback is None:
                      fallback = row
                  continue
              print(row)
              raise SystemExit(0)
          if fallback:
              print(fallback)
              raise SystemExit(0)
          raise SystemExit(1)
          PY
          )

          UDID=$(echo "$SELECTED" | cut -d'|' -f1)
          SIM_OS=$(echo "$SELECTED" | cut -d'|' -f2)
          SIM_NAME=$(echo "$SELECTED" | cut -d'|' -f3-)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "SIM_OS=$SIM_OS" >> "$GITHUB_ENV"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"
          {
            echo "## Simulator"
            echo "- Plan: \`${TEST_PLAN}\`"
            echo "- Device: ${SIM_NAME} (iOS ${SIM_OS})"
            echo "- Xcode: ${XCODE_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          # -b bloque jusqu’au boot ; timeout implicite runner.
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true

      - name: Map TEST_PLAN → xcodebuild -only-testing
        id: plan
        run: |
          set -euo pipefail
          PLAN="${TEST_PLAN:-all}"
          ONLY=()
          case "$PLAN" in
            smoke)
              # 1 launch × 3 tabs — budget ≤5 min (build cache + tests courts)
              ONLY+=("-only-testing:ChatbotNativeUITests/SmokeGateUITests")
              REQUIRED="chat-empty.png mail-inbox.png files-root.png"
              ;;
            mail)
              ONLY+=("-only-testing:ChatbotNativeUITests/MailReadabilityUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/MailDraftUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/MailAssistantUITests")
              REQUIRED="mail-inbox.png mail-detail-html.png mail-detail-text.png mail-summary.png mail-draft.png mail-assistant.png"
              ;;
            chat)
              ONLY+=("-only-testing:ChatbotNativeUITests/SimulatorMVPUITests/testChatEmptyAndKeyboardScreenshots")
              ONLY+=("-only-testing:ChatbotNativeUITests/SimulatorMVPUITests/testChatThinkingAndAgentScreenshots")
              ONLY+=("-only-testing:ChatbotNativeUITests/HandoffUITests")
              REQUIRED="chat-empty.png chat-composer.png chat-keyboard-dismissed.png chat-thinking.png chat-agent.png chat-handoff-mail.png chat-handoff-files.png"
              ;;
            files)
              ONLY+=("-only-testing:ChatbotNativeUITests/FilesNavigationUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/FilesAssistantUITests")
              REQUIRED="files-root.png files-folder-documents.png files-nested.png files-preview.png files-assistant.png"
              ;;
            assistants)
              ONLY+=("-only-testing:ChatbotNativeUITests/MailAssistantUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/FilesAssistantUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/HistoryIsolationUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/MailDraftUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/HandoffUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/FilesNavigationUITests")
              REQUIRED="mail-assistant.png files-assistant.png history-mail-scope.png history-files-scope.png mail-draft.png chat-handoff-mail.png chat-handoff-files.png files-nested.png files-preview.png"
              ;;
            gate)
              ONLY+=("-only-testing:ChatbotNativeUITests/SmokeGateUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/SimulatorMVPUITests/testChatThinkingAndAgentScreenshots")
              ONLY+=("-only-testing:ChatbotNativeUITests/MailReadabilityUITests/testMailHtmlTextSummaryAndBack")
              REQUIRED="chat-empty.png mail-inbox.png files-root.png chat-thinking.png chat-agent.png mail-detail-html.png mail-summary.png"
              ;;
            all)
              ONLY+=("-only-testing:ChatbotNativeUITests/SimulatorMVPUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/MailReadabilityUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/MailDraftUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/MailAssistantUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/FilesAssistantUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/FilesNavigationUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/HistoryIsolationUITests")
              ONLY+=("-only-testing:ChatbotNativeUITests/HandoffUITests")
              REQUIRED="chat-empty.png mail-inbox.png mail-detail-html.png mail-detail-text.png mail-summary.png files-root.png chat-composer.png chat-keyboard-dismissed.png chat-thinking.png chat-agent.png files-folder-documents.png files-nested.png files-preview.png mail-draft.png mail-assistant.png files-assistant.png history-mail-scope.png history-files-scope.png chat-handoff-mail.png chat-handoff-files.png"
              ;;
            *)
              echo "::error::Unknown TEST_PLAN=$PLAN (use smoke|gate|chat|mail|files|assistants|all)"
              exit 1
              ;;
          esac
          # shell array → env (newline-separated)
          printf '%s\n' "${ONLY[@]}" > /tmp/only-testing.txt
          echo "REQUIRED_SHOTS=${REQUIRED}" >> "$GITHUB_ENV"
          {
            echo "ONLY_TESTING<<EOF"
            cat /tmp/only-testing.txt
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Plan=$PLAN" >> "$GITHUB_STEP_SUMMARY"
          echo "Required: $REQUIRED" >> "$GITHUB_STEP_SUMMARY"

      - name: Build for testing
        id: build
        working-directory: apps/ios
        run: |
          set -euo pipefail
          BUILD_START=$(date +%s)
          set +e
          xcodebuild build-for-testing \
            -project ChatbotNative.xcodeproj \
            -scheme ChatbotNativeUI \
            -destination "id=${UDID}" \
            -derivedDataPath derived-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet
          BUILD_STATUS=$?
          set -e
          BUILD_END=$(date +%s)
          echo "BUILD_SECONDS=$((BUILD_END - BUILD_START))" >> "$GITHUB_ENV"
          echo "Build-for-testing: ${BUILD_SECONDS:-?}s (exit $BUILD_STATUS)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::build-for-testing failed"
            exit "$BUILD_STATUS"
          fi

      - name: UI tests (Simulator)
        id: uitest
        working-directory: apps/ios
        env:
          TEST_RUNNER_CHATBOT_SIM_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/simulator
          CHATBOT_SIM_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/simulator
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/artifacts/simulator"
          RESULT_DIR="${RUNNER_TEMP}/ios-sim-results"
          mkdir -p "$RESULT_DIR"
          ONLY_ARGS=()
          while IFS= read -r line; do
            [ -n "$line" ] && ONLY_ARGS+=("$line")
          done < /tmp/only-testing.txt
          TEST_START=$(date +%s)
          set +e
          xcodebuild test-without-building \
            -project ChatbotNative.xcodeproj \
            -scheme ChatbotNativeUI \
            -destination "id=${UDID}" \
            -derivedDataPath derived-sim \
            -resultBundlePath "$RESULT_DIR/ChatbotUI.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${ONLY_ARGS[@]}" \
            2>&1 | tee /tmp/xcodebuild-sim.log
          XC_STATUS=${PIPESTATUS[0]}
          set -e
          TEST_END=$(date +%s)
          echo "UI_TEST_SECONDS=$((TEST_END - TEST_START))" >> "$GITHUB_ENV"
          echo "XC_STATUS=$XC_STATUS" >> "$GITHUB_ENV"
          echo "test-without-building: $((TEST_END - TEST_START))s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$XC_STATUS" -ne 0 ]; then
            echo "::error::UI tests failed (exit $XC_STATUS)"
            exit "$XC_STATUS"
          fi

      - name: Collect + verify screenshots
        if: always()
        run: |
          set -euo pipefail
          DIR="${{ github.workspace }}/artifacts/simulator"
          mkdir -p "$DIR"
          if [ -d /tmp/chatbot-sim-screenshots ]; then
            cp -f /tmp/chatbot-sim-screenshots/*.png "$DIR/" 2>/dev/null || true
          fi
          # Fallback xcresult uniquement si PNG manquants (évite export coûteux).
          NEED_EXPORT=0
          for f in ${REQUIRED_SHOTS}; do
            [ -f "$DIR/$f" ] || NEED_EXPORT=1
          done
          RESULT="${RUNNER_TEMP}/ios-sim-results/ChatbotUI.xcresult"
          if [ "$NEED_EXPORT" -eq 1 ] && [ -d "$RESULT" ]; then
            xcrun xcresulttool export attachments \
              --path "$RESULT" \
              --output-path "$DIR/xcattachments" 2>/dev/null || true
            if [ -d "$DIR/xcattachments" ]; then
              find "$DIR/xcattachments" -type f \( -name '*.png' -o -name '*.jpeg' \) | while read -r f; do
                lower=$(echo "$f" | tr '[:upper:]' '[:lower:]')
                dest=""
                case "$lower" in
                  *chat-empty*) dest="chat-empty.png" ;;
                  *mail-inbox-after*) dest="mail-inbox-after-back.png" ;;
                  *mail-inbox*) dest="mail-inbox.png" ;;
                  *mail-detail-html*) dest="mail-detail-html.png" ;;
                  *mail-detail-text*) dest="mail-detail-text.png" ;;
                  *mail-summary*) dest="mail-summary.png" ;;
                  *files-root*) dest="files-root.png" ;;
                  *files-folder-documents*) dest="files-folder-documents.png" ;;
                  *files-nested*) dest="files-nested.png" ;;
                  *files-back*) dest="files-back-to-root.png" ;;
                  *chat-composer*) dest="chat-composer.png" ;;
                  *chat-keyboard-dismissed*) dest="chat-keyboard-dismissed.png" ;;
                  *chat-thinking*) dest="chat-thinking.png" ;;
                  *chat-agent-error*) dest="chat-agent-error.png" ;;
                  *chat-agent-stopped*) dest="chat-agent-stopped.png" ;;
                  *chat-agent*) dest="chat-agent.png" ;;
                esac
                if [ -n "$dest" ]; then cp -f "$f" "$DIR/$dest"; fi
              done
            fi
          fi
          echo "## Screenshots (${TEST_PLAN})" >> "$GITHUB_STEP_SUMMARY"
          ls -la "$DIR" || true
          MISSING=0
          for f in ${REQUIRED_SHOTS}; do
            if [ -f "$DIR/$f" ]; then
              echo "- PASS $f ($(wc -c < "$DIR/$f") bytes)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- FAIL missing $f" >> "$GITHUB_STEP_SUMMARY"
              MISSING=1
            fi
          done
          # Ne fail verify que si les tests ont réussi (sinon artefact partiel OK).
          if [ "${XC_STATUS:-1}" = "0" ] && [ "$MISSING" -ne 0 ]; then
            echo "::error::Required screenshots missing for plan=${TEST_PLAN}"
            exit 1
          fi
          meta="${DIR}/sim-meta.json"
          cat > "$meta" <<EOF
          {
            "git_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "test_plan": "${TEST_PLAN}",
            "xcode": "${XCODE_VERSION}",
            "device": "${SIM_NAME}",
            "ios": "${SIM_OS}",
            "udid": "${UDID}",
            "build_seconds": ${BUILD_SECONDS:-0},
            "ui_test_seconds": ${UI_TEST_SECONDS:-0},
            "workflow": "simulator"
          }
          EOF
          {
            echo ""
            echo "## Timing"
            echo "- build-for-testing: ${BUILD_SECONDS:-?}s"
            echo "- test-without-building: ${UI_TEST_SECONDS:-?}s"
            echo "- plan: ${TEST_PLAN}"
          } >> "$GITHUB_STEP_SUMMARY"
          TOTAL=$(( ${BUILD_SECONDS:-0} + ${UI_TEST_SECONDS:-0} ))
          if [ "${TEST_PLAN}" = "smoke" ] && [ "$TOTAL" -gt 240 ]; then
            echo "::warning::Smoke build+test ${TOTAL}s — cible ≤4m hors setup (cache DerivedData)"
          fi
          if [ "${TEST_PLAN}" = "smoke" ] && [ "$TOTAL" -gt 360 ]; then
            echo "::error::Smoke exceeded 6m build+test (${TOTAL}s)"
            exit 1
          fi

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: artifacts/simulator/
          if-no-files-found: warn
          retention-days: 14

      # xcresult ~80MB — uniquement en échec (diagnostic).
      - name: Upload xcresult (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-xcresult
          path: ${{ runner.temp }}/ios-sim-results
          if-no-files-found: ignore
          retention-days: 7

name: Contracts

on:
  push:
    branches: [main, master]
    paths:
      - "contracts/**"
      - "scripts/contracts-check.mjs"
      - "scripts/privacy-scan.mjs"
      - "src/lib/http/api-error.ts"
      - "src/lib/contracts/**"
      - "src/lib/agent/events.ts"
      - "src/lib/mail/handoff.ts"
      - "src/lib/files/handoff.ts"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/contracts-check.mjs"
      - "scripts/privacy-scan.mjs"
      - "src/lib/http/api-error.ts"
      - "src/lib/contracts/**"
      - "src/lib/agent/events.ts"
      - "src/lib/mail/handoff.ts"
      - "src/lib/files/handoff.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Privacy scan (no personal infra / secrets in tree)
        run: npm run privacy:scan
      - name: Validate contracts + fixtures
        run: node scripts/contracts-check.mjs
      # Ciblé — pas `npm test` complet (évite suites email/DB hors scope contracts).
      # Lockfile / package.json désynchro : lot séparé, ne pas « réparer » ici.
      - name: Unit tests (contracts-related)
        run: npx vitest run src/lib/contracts src/lib/http/api-error.ts --passWithNoTests

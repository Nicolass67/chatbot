name: Contracts

on:
  push:
    branches: [main, master]
    paths:
      - "contracts/**"
      - "scripts/contracts-check.mjs"
      - "src/lib/http/api-error.ts"
      - "src/lib/contracts/**"
      - "src/lib/agent/events.ts"
      - "src/lib/mail/handoff.ts"
      - "src/lib/files/handoff.ts"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/contracts-check.mjs"
      - "src/lib/http/api-error.ts"
      - "src/lib/contracts/**"
      - "src/lib/agent/events.ts"
      - "src/lib/mail/handoff.ts"
      - "src/lib/files/handoff.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Privacy scan (no personal infra / secrets in tree)
        run: npm run privacy:scan
      - name: Validate contracts + fixtures
        run: node scripts/contracts-check.mjs
      - name: Unit tests (contracts-related + full)
        run: npm test
